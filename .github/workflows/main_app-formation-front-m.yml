name: Build and deploy - app-formation-front-m

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Courses exactes et cuisson
        run: |
          npm ci
          npm run build

      - name: Verifier le gateau et preparer le carton
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERREUR : gateau introuvable, livraison annulee"
            exit 1
          else
            echo "Gateau OK, on emballe"
          fi
          rm -rf deploy-package
          mkdir deploy-package
          cp -r dist deploy-package/

      - name: Connexion a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B19575C624694972979463DC770A0B34 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9436FC94582D44199A7C01E380126CF5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_40A785348D1340228084B0812E06C6A0 }}

      - name: Livraison
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-formation-front-m'
          slot-name: 'staging'
          package: deploy-package
          clean: true

      - name: Deconnexion
        if: always()
        run: az logout || true
